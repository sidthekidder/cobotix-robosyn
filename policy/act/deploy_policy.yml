# ACT Policy Evaluation Configuration
# python scripts/eval_policy.py --config policy/act/deploy_policy.yml

# ------------------------------------------------------------------
# Basic experiment configuration (Each policy must be retained.)
# ------------------------------------------------------------------
policy_name: act
task_name: null
setting: null
model_name: null
seed: 0
max_episodes: 20
max_steps: 1000
headless: false
pytorch_device: cuda
filter_dataset_saving: true
eval_video_log: true
eval_video_obs_keys:
  - cam_high
  - cam_right_wrist
  - cam_left_wrist
eval_reset_sync_steps: 1
eval_expert_check: true
eval_episode_seeds: null

# ------------------------------------------------------------------
# ACT Policy parameters used by get_model()
# ------------------------------------------------------------------
checkpoint_path: null
act_step: 10
n_action_steps: null
act_recovery_enabled: false
act_recovery_min_step: 60
act_recovery_plateau_steps: 10
act_recovery_min_press_depth_m: 0.0011
act_recovery_press_epsilon_m: 0.0001
act_recovery_cooldown_steps: 25
act_recovery_max_replans: 2
state_obs_path: robot/qpos
strict_action_dim: true
image_key_map:
  observation.images.cam_high: cam_high
  observation.images.cam_right_wrist: cam_right_wrist
  observation.images.cam_left_wrist: cam_left_wrist
